<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EEAM_BibleSong Pro - Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Noto fonts: improve Arabic and CJK coverage -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/display/bsp-display.css">
</head>
<body>
  <div id="bg-layer" class="hardware-accelerated">
    <video id="bg-video" class="bg-video" muted playsinline loop></video>
    <div id="bg-youtube" class="bg-youtube">
      <iframe id="bg-youtube-frame" title="Background YouTube" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>
  </div>
  <div id="bg-layer-crossfade"></div>
  <div id="lt-bg-wrap" class="hardware-accelerated">
    <div id="lt-bg-inner" class="hardware-accelerated">
      <video id="lt-bg-video" class="bg-video" muted playsinline loop></video>
      <div id="lt-bg-youtube" class="bg-youtube">
        <iframe id="lt-bg-youtube-frame" title="Lower Third YouTube" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
      </div>
    </div>
    <div id="lt-bg-crossfade"></div>
  </div>
  <div id="custom-lt-ref-box" class="hardware-accelerated"></div>
  <div id="custom-lt-version-bar" class="hardware-accelerated"></div>
  <div id="custom-lt-main-bar" class="hardware-accelerated"></div>
  <style>
    /* Sous-titre actif : masque TOUT le contenu à l'antenne — le TEXTE (verset/chant) ET son
       FOND (image / dégradé / couleur, plein écran comme lower-third) — sans toucher aux opacités
       inline des fondus du contenu (d'où !important) ; se rétablit dès que la classe est retirée.
       La classe vit sur <body> car les couches de fond sont hors de #display-container. Le
       #subtitle-overlay n'est PAS listé → il reste visible (avec son propre fond de scène). */
    body.bsp-sub-hide-content #text-container,
    body.bsp-sub-hide-content #bg-layer,
    body.bsp-sub-hide-content #bg-layer-crossfade,
    body.bsp-sub-hide-content #lt-bg-wrap,
    body.bsp-sub-hide-content #custom-lt-ref-box,
    body.bsp-sub-hide-content #custom-lt-version-bar,
    body.bsp-sub-hide-content #custom-lt-main-bar,
    body.bsp-sub-hide-content #sd-edge-svg {
      opacity: 0 !important;
      transition: opacity .32s ease !important;
    }
  </style>
  <div id="display-container" class="mode-full">
    <div id="text-container" class="hardware-accelerated"></div>
    <div id="subtitle-overlay" style="position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden"></div>
  </div>

  <div id="debug-overlay" style="position: fixed; right: 12px; top: 12px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px; border-radius: 8px; z-index: 9999; font-family: monospace; font-size: 12px; max-width: 440px; max-height: 60vh; overflow:auto; display: none;">
    <div id="debug-status" style="font-weight:bold;margin-bottom:6px">DEBUG: initializing...</div>
    <div id="debug-logs"></div>
  </div>

  <script src="js/panel/subtitles.js"></script>
  <script>
    'use strict';

    // ===== CONSTANTS / GLOBALS =====
    const CHANNEL_NAME = 'bible_song_pro_v1';
    const RELAY_DEFAULT_PORT = 5511;
    const REMOTE_SHOW_PROTOCOL_VERSION = 1;
    const SYNC_MIRROR_DB_NAME = 'bible-song-pro-sync';
    const SYNC_MIRROR_DB_VERSION = 1;
    const SYNC_MIRROR_STORE = 'messages';
    const SYNC_MIRROR_LAST_KEY = 'last';
    const channel = (typeof BroadcastChannel === 'function') ? new BroadcastChannel(CHANNEL_NAME) : null;
    // Which output this page is. Default 'obs': an existing Browser Source added with no
    // query string keeps behaving exactly as before.
    const BSP_OUTPUT_ID = (() => {
      try {
        const id = new URLSearchParams(window.location.search || '').get('outputId');
        return (id && String(id).trim()) || 'obs';
      } catch (_) { return 'obs'; }
    })();
    const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
    const typeAnim = { textKey: null, startTime: 0, duration: 0, rafId: null, words: [] };
    const transitionState = { textKey: null, type: null, startTime: 0, duration: 0 };
    let clearTimer = null;
    let clearToken = 0;
    let bgActivePrev = false;
    let ltBgActivePrev = false;
    let customBgActivePrev = false;
    let prevBgState = { full: false, lt: false, custom: false };
    let animateBgTransitions = true;
    let hasSynced = false;
    let helloTimer = null;
    const loadedFonts = new Set();
    // Track which Google font families we have injected
    const loadedGoogleFonts = new Set();
    let relaySocket = null;
    let relayUrl = '';
    let relayReconnectTimer = null;
    let relayBackoff = 1500;
    let relayConnectedOnce = false;
    let mirrorUpdateFallbackAt = 0;
    const relayClientId = `display_${Math.random().toString(36).slice(2, 10)}`;
    let syncMirrorDbPromise = null;
    let syncMirrorPollTimer = null;
    let lastMirrorSeq = 0;

    // ===== TYPOGRAPHY =====
    function loadGoogleFontIfNeeded(family) {
      if (!family) return;
      try {
        if (loadedGoogleFonts.has(family)) return;
        // family may include weight spec like 'Noto Sans Devanagari:wght@400;700'
        const familyParam = String(family).replace(/\s+/g, '+');
        const href = `https://fonts.googleapis.com/css2?family=${familyParam}&display=swap`;
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        document.head.appendChild(link);
        loadedGoogleFonts.add(family);
        debug('Loading Google font: ' + family);
      } catch (e) {
        console.error('Failed to load Google font', family, e);
      }
    }

    // Map a selected font-family string to a Google Fonts family identifier (if applicable)
    function mapFontFamilyToGoogle(fontFamilyString) {
      if (!fontFamilyString) return null;
      const f = String(fontFamilyString).toLowerCase();
      if (f.includes('noto sans devanagari')) return 'Noto Sans Devanagari:wght@400;700';
      if (f.includes('noto sans bengali')) return 'Noto Sans Bengali:wght@400;700';
      if (f.includes('noto sans gurmukhi') || f.includes('gurmukhi')) return 'Noto Sans Gurmukhi:wght@400;700';
      if (f.includes('noto sans gujarati')) return 'Noto Sans Gujarati:wght@400;700';
      if (f.includes('noto sans tamil')) return 'Noto Sans Tamil:wght@400;700';
      if (f.includes('noto sans telugu')) return 'Noto Sans Telugu:wght@400;700';
      if (f.includes('noto sans kannada')) return 'Noto Sans Kannada:wght@400;700';
      if (f.includes('noto sans malayalam')) return 'Noto Sans Malayalam:wght@400;700';
      if (f.includes('noto sans sinhala')) return 'Noto Sans Sinhala:wght@400;700';
      if (f.includes('noto sans myanmar')) return 'Noto Sans Myanmar:wght@400;700';
      if (f.includes('noto sans ethiopic')) return 'Noto Sans Ethiopic:wght@400;700';
      if (f.includes('noto sans thai')) return 'Noto Sans Thai:wght@400;700';
      if (f.includes('noto sans lao')) return 'Noto Sans Lao:wght@400;700';
      if (f.includes('noto sans khmer')) return 'Noto Sans Khmer:wght@400;700';
      if (f.includes('noto sans arabic')) return 'Noto Sans Arabic:wght@400;700';
      if (f.includes('noto sans hebrew')) return 'Noto Sans Hebrew:wght@400;700';
      if (f.includes('montserrat')) return 'Montserrat:wght@400;500;600;700;800;900';
      if (f.includes('noto sans sc')) return 'Noto Sans SC:wght@400;700';
      if (f.includes('noto sans tc')) return 'Noto Sans TC:wght@400;700';
      if (f.includes('noto sans jp')) return 'Noto Sans JP:wght@400;700';
      if (f.includes('noto sans kr')) return 'Noto Sans KR:wght@400;700';
      if (f.includes('noto sans')) return 'Noto Sans:wght@400;700';
      if (f.includes('noto serif')) return 'Noto Serif:wght@400;700';
      return null;
    }
    // Remember last song LT layout so we can preserve visual position when BG is toggled off
    let lastSongLtLayout = {
      visualBottom: null, // px from viewport bottom to content bottom
      visualTop: null,    // px from viewport top to content top
      visualBottomNorm: null,
      visualTopNorm: null,
      padTopPx: null,
      padBottomPx: null,
      sidePad: null,      // e.g. "10%"
      heightVh: null,
      anchor: 'bottom'
    };
    
    // Signature du dernier contenu RENDU (anti-scintillement dans handleUpdate). Remise à
    // null sur clear pour qu'un ré-affichage du même contenu après un effacement redessine.
    let bspLastAppliedSig = null;

    // Current display state
    let currentState = {
      mode: 'full',
      isBible: false,
      text: '',
      styleData: null,
      isLive: false
    };
    
    // Performance optimization
    let rafId = null;
    let lastUpdateTime = 0;
    let lastSeq = 0;
    let lastLtBgMode = 'solid';
    let lastBGMode = 'solid';
    let lastBgType = 'color';
    let lastLtBgType = 'color';
    // Store last background styles for crossfade dissolves
    let lastFullBgStyle = { backgroundImage: 'none', backgroundColor: 'black' };
    let lastLtBgStyle = { backgroundImage: 'none', backgroundColor: 'black' };
    const UPDATE_THROTTLE = 16; // ~60fps
    const MIN_SONG_LT_NO_BG_BOTTOM_PAD_PX = 40;
    const MIN_SONG_LT_NO_BG_TOP_PAD_PX = 24;
    // Debug mode controlled by URL param `?debug=1` or `?debug`, OR toggled live with the
    // `d` key on any display (utile sur un écran connecté ouvert sans ?debug : appuyer sur
    // « d » affiche le journal des messages reçus + le mode réellement appliqué, pour
    // diagnostiquer un « retour en FS » sans devoir changer l'URL).
    let DEBUG_MODE = new URLSearchParams(window.location.search).has('debug');
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'd' || e.key === 'D') && !e.ctrlKey && !e.metaKey && !e.altKey) {
        DEBUG_MODE = !DEBUG_MODE;
        const dbg = document.getElementById('debug-overlay');
        if (dbg) dbg.style.display = DEBUG_MODE ? 'block' : 'none';
        if (DEBUG_MODE && typeof debug === 'function') debug('== overlay activé (touche d) ==');
      }
    });

    // Marqueur de build VISIBLE : permet de vérifier que c'est bien le dernier code qui
    // tourne (et non une version en cache OBS/Electron). Affiché 6 s en bas à gauche au
    // chargement, loggé en console, et repris dans l'overlay debug.
    const BSP_BUILD = 'BUILD-17 · 2026-09-21 (sous-titres : fond de scène plein écran + masque le fond du contenu)';
    // Le tampon de build VERT n'apparaît plus automatiquement sur les écrans (demandé : sorties
    // propres). Il reste loggé en console et repris dans l'overlay debug (touche « d ») pour
    // vérifier au besoin que c'est bien le dernier code qui tourne.
    try {
      console.log('[BSP] ' + BSP_BUILD + ' — display');
    } catch(_) {}

    // DOM Elements
    const elements = {
      txt: document.getElementById('text-container'),
      bg: document.getElementById('bg-layer'),
      bgCrossfade: document.getElementById('bg-layer-crossfade'),
      bgVideo: document.getElementById('bg-video'),
      bgYoutube: document.getElementById('bg-youtube'),
      bgYoutubeFrame: document.getElementById('bg-youtube-frame'),
      cont: document.getElementById('display-container'),
      ltWrap: document.getElementById('lt-bg-wrap'),
      ltInner: document.getElementById('lt-bg-inner'),
      ltCrossfade: document.getElementById('lt-bg-crossfade'),
      ltVideo: document.getElementById('lt-bg-video'),
      ltYoutube: document.getElementById('lt-bg-youtube'),
      ltYoutubeFrame: document.getElementById('lt-bg-youtube-frame'),
      customRefBox: document.getElementById('custom-lt-ref-box'),
      customVersionBar: document.getElementById('custom-lt-version-bar'),
      customMainBar: document.getElementById('custom-lt-main-bar'),
      customMainText: null,
      customRefText: null,
      customVersionText: null
    };

    // Simple on-screen debug logger (temporary)
    function debug(msg, isError = false) {
      try {
        // Errors always surface. Routine trace is logged only in debug mode — otherwise
        // a synced display prints one console line per inbound message forever (the
        // "MSG(bc): SYNC_STATE" spam).
        if (isError) console.error('[DISPLAY DEBUG]', msg);
        else if (DEBUG_MODE) console.log('[DISPLAY DEBUG]', msg);

        // Only update the on-screen overlay when in debug mode
        if (!DEBUG_MODE) return;

        const logs = document.getElementById('debug-logs');
        const status = document.getElementById('debug-status');
        if (logs) {
          const el = document.createElement('div');
          el.style.whiteSpace = 'pre-wrap';
          el.style.marginBottom = '6px';
          el.textContent = (new Date()).toLocaleTimeString() + ' — ' + String(msg);
          if (isError) el.style.color = '#ff8080';
          logs.prepend(el);
        }
        if (status && !isError) status.innerText = String(msg).split('\n')[0];
        if (isError && status) status.innerText = 'Error — see logs';
      } catch (e) {
        console.error('debug helper failed', e);
      }
    }

    function openSyncMirrorDb() {
      if (syncMirrorDbPromise) return syncMirrorDbPromise;
      syncMirrorDbPromise = new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(SYNC_MIRROR_DB_NAME, SYNC_MIRROR_DB_VERSION);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(SYNC_MIRROR_STORE)) {
              db.createObjectStore(SYNC_MIRROR_STORE);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error || new Error('Failed to open sync mirror DB'));
        } catch (err) {
          reject(err);
        }
      }).catch(err => {
        syncMirrorDbPromise = null;
        return Promise.reject(err);
      });
      return syncMirrorDbPromise;
    }

    function readMirrorMessage() {
      return openSyncMirrorDb().then(db => new Promise((resolve, reject) => {
        try {
          const tx = db.transaction(SYNC_MIRROR_STORE, 'readonly');
          const req = tx.objectStore(SYNC_MIRROR_STORE).get(SYNC_MIRROR_LAST_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error || new Error('Failed to read sync mirror message'));
        } catch (err) {
          reject(err);
        }
      })).catch(() => null);
    }

    function syncFromMirror(force = false) {
      readMirrorMessage().then(record => {
        if (!record || !record.msg) return;
        if (record.msg.type === 'UPDATE' && mirrorUpdateFallbackAt && Date.now() < mirrorUpdateFallbackAt) return;
        const seq = Number(record.seq || (record.msg && record.msg.seq) || 0);
        if (!force && seq && seq <= lastMirrorSeq) return;
        lastMirrorSeq = Math.max(lastMirrorSeq, seq);
        handleInboundMessage(record.msg, 'idb');
      }).catch(() => {});
    }

    function startMirrorPolling() {
      if (syncMirrorPollTimer) return;
      syncMirrorPollTimer = setInterval(() => {
        syncFromMirror(false);
      }, 800);
    }
    
    // ===== SYNC (BroadcastChannel) =====
    // Initialize
    function init() {
      // Set up CSS custom properties for smooth transitions
      document.documentElement.style.setProperty('--transition-timing', 'cubic-bezier(0.4, 0, 0.2, 1)');
      
      // Set initial opacity to 0 for fade-in effect
      elements.txt.style.opacity = '0';
      elements.bg.style.opacity = '0';
      elements.ltWrap.style.opacity = '0';
      
      // Reveal debug overlay and report init
      const dbg = document.getElementById('debug-overlay');
      if (dbg) dbg.style.display = DEBUG_MODE ? 'block' : 'none';
      if (DEBUG_MODE) debug('init: initialized (overlay visible)');
      else console.log('init: debug overlay hidden');

      // Send initial ping + state request
      mirrorUpdateFallbackAt = Date.now() + 2500;
      sendDisplayHello('init');
      connectRelay();
      startMirrorPolling();
      if (helloTimer) clearInterval(helloTimer);
      helloTimer = setInterval(() => {
        // Stop the fast HELLO burst as soon as we are synced. It used to also wait for
        // relayConnectedOnce, but a BroadcastChannel-only display (OBS preview / file://
        // output with no ?pair) NEVER connects a relay, so that condition never held and
        // the display sent a HELLO every 500 ms forever — and the panel replayed a
        // SYNC_STATE on every one. The relay's own connect/reconnect lifecycle is handled
        // independently by connectRelay() + scheduleRelayReconnect(), so dropping the
        // relayConnectedOnce requirement here loses nothing.
        if (hasSynced) {
          // Une fois synchronisé, on arrête la rafale rapide MAIS on garde un battement
          // lent. Sans lui, après un rechargement du panneau (Ctrl+R) — qui repart sans
          // connaître les affichages déjà ouverts — l'écran resterait muet et figé jusqu'à
          // ce qu'on le recharge. Ce HELLO périodique laisse le panneau nous redécouvrir et
          // rejouer l'état : l'écran se resynchronise seul. Le panneau debounce les rejeux
          // et acceptSeq ignore les doublons, donc aucun scintillement.
          clearInterval(helloTimer);
          helloTimer = setInterval(() => {
            sendDisplayHello('heartbeat');
            if (!relaySocket || relaySocket.readyState === WebSocket.CLOSED || relaySocket.readyState === WebSocket.CLOSING) {
              connectRelay();
            }
          }, 4000);
          return;
        }
        sendDisplayHello('retry');
        if (!relaySocket || relaySocket.readyState === WebSocket.CLOSED || relaySocket.readyState === WebSocket.CLOSING) {
          connectRelay();
        }
        syncFromMirror(false);
      }, 500);
      
      // Self-test: only run in debug mode
      if (DEBUG_MODE) {
        setTimeout(() => {
          debug('Self-test: drawing sample text');
          try {
            handleUpdate({ text: 'Self-test: display rendering OK', mode: 'full', isBible: false, fontSizeFull: 80, fontSizeLT: 36, lineHeightFull: 1.1, lineHeightLT: 1.1, transitionType: 'fade', transitionDuration: 0.3 });
          } catch (e) { debug('Self-test error: ' + (e && e.message ? e.message : String(e)), true); }
        }, 1200);
      }

      console.log('Bible Song Pro Display initialized');
    }
    
    // Handle incoming messages
    function acceptSeq(seq) {
      if (!seq) return true;
      if (seq <= lastSeq) return false;
      lastSeq = seq;
      return true;
    }

    function applyUpdateWithThrottle(data) {
      const now = performance.now();
      if (now - lastUpdateTime < UPDATE_THROTTLE) {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(() => handleUpdate(data));
      } else {
        handleUpdate(data);
        lastUpdateTime = now;
      }
    }

    function normalizePairCode(raw) {
      return String(raw || '').replace(/[^0-9a-zA-Z]/g, '').slice(0, 32).toUpperCase();
    }

    function getRelayPairCode() {
      try {
        const params = new URLSearchParams(window.location.search || '');
        return normalizePairCode(params.get('pair') || params.get('token') || '');
      } catch (_) {
        return '';
      }
    }

    function relayNormalizeInbound(raw) {
      if (!raw || typeof raw !== 'object') return null;
      if (raw.type !== 'RS_ENVELOPE') return raw;
      const ver = Number(raw.version || 0);
      if (!Number.isFinite(ver) || ver < 1) return null;
      if (!raw.payload || typeof raw.payload !== 'object') return null;
      if (raw.senderId && raw.senderId === relayClientId) return null;
      return raw.payload;
    }

    function relaySend(msg) {
      if (!relaySocket || relaySocket.readyState !== WebSocket.OPEN) return;
      if (!msg || typeof msg !== 'object' || typeof msg.type !== 'string') return;
      const pairCode = getRelayPairCode();
      const envelope = {
        type: 'RS_ENVELOPE',
        version: REMOTE_SHOW_PROTOCOL_VERSION,
        senderId: relayClientId,
        sessionId: pairCode ? `session_${pairCode.toLowerCase()}` : 'session_default',
        token: pairCode,
        ts: Date.now(),
        payload: msg
      };
      try { relaySocket.send(JSON.stringify(envelope)); } catch (e) {}
    }

    function sendDisplayHello(reason) {
      const msg = { type: 'HELLO', proto: 1, sender: 'display', clientId: relayClientId, reason, ts: Date.now() };
      if (channel) channel.postMessage(msg);
      relaySend(msg);
    }

    function buildRelayUrl() {
      const params = new URLSearchParams(window.location.search);
      const override = params.get('relay');
      if (override) return override;
      const protocol = (window.location.protocol === 'https:') ? 'wss:' : 'ws:';
      let host = window.location.hostname || '';
      if (!host || host === 'localhost') host = '127.0.0.1';
      const port = params.get('relayPort') || RELAY_DEFAULT_PORT;
      if (!host || !port) return '';
      return `${protocol}//${host}:${port}`;
    }

    function disconnectRelay() {
      if (relayReconnectTimer) {
        clearTimeout(relayReconnectTimer);
        relayReconnectTimer = null;
      }
      if (relaySocket) {
        try { relaySocket.close(); } catch (e) {}
      }
      relaySocket = null;
    }

    function scheduleRelayReconnect() {
      if (relayReconnectTimer) return;
      relayReconnectTimer = setTimeout(() => {
        relayReconnectTimer = null;
        connectRelay();
      }, relayBackoff);
      relayBackoff = Math.min(relayBackoff * 1.5, hasSynced ? 3000 : 5000);
    }

    // Passe à true quand le serveur nous a explicitement refusés (4401/4409) : le
    // helloTimer de 500 ms rappelle connectRelay() en continu tant que la page n'est
    // pas synchronisée, donc le verrou doit vivre ICI, au point d'entrée unique — une
    // garde dans onclose seule serait contournée au tick suivant.
    let relayRejectedByServer = false;

    function connectRelay() {
      if (relayRejectedByServer) return;
      // Le relais n'a de sens qu'appairé. Les affichages locaux (aperçu intégré du
      // panneau, fenêtre de sortie en file://) n'ont pas de ?pair dans leur URL : ils
      // vivent du BroadcastChannel et ne doivent PAS marteler le serveur — qui, strict,
      // rejetterait chaque tentative en boucle.
      if (!getRelayPairCode()) return;
      const url = buildRelayUrl();
      if (!url) return;
      if (relaySocket && relayUrl === url && (relaySocket.readyState === WebSocket.OPEN || relaySocket.readyState === WebSocket.CONNECTING)) return;
      disconnectRelay();
      relayUrl = url;
      try {
        relaySocket = new WebSocket(url);
      } catch (e) {
        scheduleRelayReconnect();
        return;
      }
      relaySocket.onopen = () => {
        relayBackoff = 1500;
        relayConnectedOnce = true;
        sendDisplayHello('relay-open');
      };
      relaySocket.onclose = (event) => {
        // 4401 = code refusé, 4409 = slot téléphone occupé : se reconnecter avec le
        // même code ne peut que reproduire le rejet — verrou définitif pour cette page.
        if (event && (event.code === 4401 || event.code === 4409)) {
          relayRejectedByServer = true;
          console.warn('[BSP] Relais : code d\'appairage refusé par le serveur (' + event.code + ') — reconnexion stoppée. Corrigez ?pair= dans l\'URL.');
          return;
        }
        scheduleRelayReconnect();
      };
      relaySocket.onerror = () => {};
      relaySocket.onmessage = (event) => {
        let data = null;
        try { data = JSON.parse(event.data); } catch (e) { return; }
        const payload = relayNormalizeInbound(data);
        if (!payload) return;
        handleInboundMessage(payload, 'relay');
      };
    }

    // The panel ships one message carrying the content once, plus a `designs` map keyed
    // by output id. Picking an entry here — rather than having the panel send one
    // message per screen — is what guarantees every screen shows the same verse at the
    // same instant: there is only ever one message to be in step with.
    // No map, or no entry for this output, means the flat fields already are its design.
    function bspResolveDesignedPayload(d) {
      if (!d || !d.designs || typeof d.designs !== 'object') return d;
      const mine = d.designs[BSP_OUTPUT_ID];
      if (!mine || typeof mine !== 'object') return d;
      const merged = {};
      // Envelope fields (type, seq, ts, sceneLayers, viewport) live only on the message.
      Object.keys(d).forEach(k => { if (k !== 'designs') merged[k] = d[k]; });
      Object.keys(mine).forEach(k => { merged[k] = mine[k]; });
      return merged;
    }

    // ── Sous-titres (overlay lower-third) : messages SUBTITLE + enchaînement avec verset/chant ──
    // Utilise les fonctions de js/panel/subtitles.js (bspSubtitleRenderStage/PlaySequence).
    let bspSubActive = null;
    function bspSubFadeContent(hide) {
      // Sur <body> : masque le texte ET les couches de fond (hors #display-container).
      document.body.classList.toggle('bsp-sub-hide-content', !!hide);
    }
    function bspSubShowNow(sub) {
      const overlay = document.getElementById('subtitle-overlay');
      if (!overlay || typeof bspSubtitleRenderStage !== 'function') return;
      const s = (typeof bspNormalizeSubtitle === 'function') ? bspNormalizeSubtitle(sub) : sub;
      bspSubtitleRenderStage(overlay, s);
      const card = (typeof bspSubtitleCardEl === 'function') ? bspSubtitleCardEl(overlay) : (overlay.firstElementChild && overlay.firstElementChild.firstElementChild);
      if (card && typeof bspSubtitlePlaySequence === 'function') bspSubtitlePlaySequence(card, s, 'in');
    }
    function bspSubHideActive(then) {
      const overlay = document.getElementById('subtitle-overlay');
      const s = bspSubActive; bspSubActive = null;
      const finish = () => { if (overlay) overlay.innerHTML = ''; bspSubFadeContent(false); if (then) then(); };
      if (overlay && s && typeof bspSubtitlePlaySequence === 'function') {
        const card = (typeof bspSubtitleCardEl === 'function') ? bspSubtitleCardEl(overlay) : (overlay.firstElementChild && overlay.firstElementChild.firstElementChild);
        if (card) {
          const ns = (typeof bspNormalizeSubtitle === 'function') ? bspNormalizeSubtitle(s) : s;
          const outTotal = bspSubtitlePlaySequence(card, ns, 'out');
          setTimeout(finish, Math.max(0, outTotal) + 60);
          return;
        }
      }
      finish();
    }
    function bspDisplaySubtitle(action, sub) {
      if (action === 'show' && sub) {
        const overlay = document.getElementById('subtitle-overlay'); if (overlay) overlay.innerHTML = '';
        bspSubActive = sub;
        bspSubFadeContent(true);                                   // le verset/chant disparaît (fondu)
        setTimeout(() => { if (bspSubActive === sub) bspSubShowNow(sub); }, 300); // puis le sous-titre entre
      } else if (action === 'hide') {
        bspSubHideActive();
      }
    }

    function handleInboundMessage(d, source) {
      debug(`MSG(${source}): ` + (d.type || 'unknown') + (d.text ? ' — ' + (String(d.text).slice(0,80)) : ''));
      try {
        switch (d.type) {
          case 'PING': {
            const pong = { type: 'PONG' };
            if (source === 'relay') relaySend(pong);
            else if (channel) channel.postMessage(pong);
            break;
          }
          case 'CLEAR':
            hasSynced = true;
            if (acceptSeq(d.seq)) clearDisplay({ fade: d.fade !== false, duration: d.transitionDuration });
            break;
          case 'SUBTITLE': {
            hasSynced = true;
            if (!acceptSeq(d.seq)) return;
            // PLAY ISOLÉ : un message ciblé (d.target) ne concerne QUE cet écran ; les autres l'ignorent.
            if (d.target && typeof BSP_OUTPUT_ID !== 'undefined' && d.target !== BSP_OUTPUT_ID) break;
            // ROUTAGE PAR SORTIE : cet écran applique SA variante si elle existe, sinon la base.
            const mineSub = (d.subByOutput && typeof BSP_OUTPUT_ID !== 'undefined' && d.subByOutput[BSP_OUTPUT_ID]) ? d.subByOutput[BSP_OUTPUT_ID] : d.sub;
            bspDisplaySubtitle(d.action, mineSub);
            break;
          }
          case 'UPDATE': {
            hasSynced = true;
            if (!acceptSeq(d.seq)) return;
            const up = bspResolveDesignedPayload(d);
            // Per-output blank (remote screen play/Stop): this output's content is hidden
            // while others carry on. Connection stays open.
            if (up && up.__blankOutput) { clearDisplay({ fade: true }); break; }
            // Enchaînement sous-titre → contenu : si un sous-titre est affiché, on le fait sortir
            // (animation inverse) PUIS on applique le nouveau verset/chant.
            if (bspSubActive) { bspSubHideActive(() => applyUpdateWithThrottle(up)); }
            else applyUpdateWithThrottle(up);
            break;
          }
          case 'SYNC_STATE': {
            const state = d.state || {};
            const payload = state.payload || null;
            const seq = payload && payload.seq ? payload.seq : d.seq;
            hasSynced = true;
            if (!acceptSeq(seq)) return;
            if (state.kind === 'clear') {
              clearDisplay();
            } else if (state.kind === 'update' && payload) {
              const sp = bspResolveDesignedPayload(payload);
              if (sp && sp.__blankOutput) { clearDisplay({ fade: true }); }
              else applyUpdateWithThrottle(sp);
            }
            break;
          }
        }
      } catch (err) {
        debug('Exception in message handler: ' + (err && err.message ? err.message : String(err)), true);
        console.error(err);
      }
    }

    if (channel) {
      channel.onmessage = (e) => {
        handleInboundMessage(e.data || {}, 'bc');
      };
    }

    // ===== BOX PADDING + FORCED FIT =====
    // Padding defines the usable area inside the box; the fit pass then guarantees the
    // content (for Bible: reference AND verse together, since both live in #text-container)
    // never spills past it — however long the passage or however large the operator sets
    // the font. Measured here rather than estimated panel-side, because only the display
    // knows the real box size, the real font metrics and the real wrapping.

    function bspPadFor(d, mode) {
      const n = (v, dflt) => (v == null ? dflt : Math.max(0, Math.min(600, Number(v) || 0)));
      return (mode === 'full')
        ? { t: n(d.padTopFull, 40), r: n(d.padRightFull, 80), b: n(d.padBottomFull, 40), l: n(d.padLeftFull, 80) }
        : { t: n(d.padTopLT, 16), r: n(d.padRightLT, 48), b: n(d.padBottomLT, 16), l: n(d.padLeftLT, 48) };
    }

    function bspApplyBoxPadding(d) {
      if (!elements.txt || !d) return;
      // SD renders with the full box; its LEFT/RIGHT padding is the customizable side-screen
      // margin (% of the narrow panel) so the text stays centered with breathing room and
      // never touches the panel edges. The fit pass reads these (resolved to px) and shrinks
      // for height, so the text is guaranteed inside the box.
      const isSd = (d.mode === 'sd-left' || d.mode === 'sd-right');
      if (isSd) {
        // Four independent SD margins. Left/Right are % of the PANEL width, Top/Bottom % of
        // the panel height. CSS padding-% resolves against the positioned ancestor (the full
        // screen), not the narrow panel, so a raw `%` would be wrong — compute px from the
        // panel's own measured size. The INNER side additionally clears the slanted edge so a
        // rectangular block is never clipped by the diagonal.
        const rect = elements.txt.getBoundingClientRect();
        const panelW = rect.width || elements.txt.clientWidth || 0;
        const panelH = rect.height || elements.txt.clientHeight || (window.innerHeight || 0);
        const clampM = (v, dflt) => Math.max(0, Math.min(40, Number(v == null ? dflt : v))) / 100;
        const mL = clampM(d.sdMarginLeft != null ? d.sdMarginLeft : d.sdMargin, 6);
        const mR = clampM(d.sdMarginRight != null ? d.sdMarginRight : d.sdMargin, 6);
        const mT = clampM(d.sdMarginTop, 4);
        const mB = clampM(d.sdMarginBottom, 4);
        // When there is a slant, the INNER side edge is drawn by the incline shape
        // (bspApplySdIncline), whose shape-margin already holds the text off the diagonal by
        // the inner margin. So the inner padding must be 0 here — otherwise the text box stops
        // short of the panel edge and the lines never reach the wide top of the diagonal.
        const hasSlant = Math.abs(Number(d.sdSlant) || 0) >= 0.5;
        const isLeft = (d.mode === 'sd-left');
        const maxPad = Math.floor(panelW * 0.45);
        let padL = Math.min(Math.round(panelW * mL), maxPad);
        let padR = Math.min(Math.round(panelW * mR), maxPad);
        if (hasSlant) { if (isLeft) padR = 0; else padL = 0; }
        elements.txt.style.paddingLeft = `${padL}px`;
        elements.txt.style.paddingRight = `${padR}px`;
        elements.txt.style.paddingTop = `${Math.round(panelH * mT)}px`;
        elements.txt.style.paddingBottom = `${Math.round(panelH * mB)}px`;
        elements.txt.style.boxSizing = 'border-box';
        return;
      }
      const p = bspPadFor(d, (d.mode || 'full') === 'full' ? 'full' : 'lt');
      elements.txt.style.paddingTop = `${p.t}px`;
      elements.txt.style.paddingBottom = `${p.b}px`;
      elements.txt.style.paddingRight = `${p.r}px`;
      elements.txt.style.paddingLeft = `${p.l}px`;
      elements.txt.style.boxSizing = 'border-box';
    }

    // ===== SD INNER-EDGE SLANT + STROKE =====
    // The panel's edge facing the screen centre can be a full-height diagonal (clip-path,
    // shared by the background layers and the text via the --sd-clip variable) with an
    // optional coloured line drawn along it. The line is a standalone SVG overlay, not a
    // CSS border: a border would be clipped away with the box. Coordinates are screen px,
    // derived from the viewport and the panel width, so the line lands exactly on the clip's
    // diagonal edge.
    function bspSdEdgeSvg() {
      let svg = document.getElementById('sd-edge-svg');
      if (!svg) {
        const NS = 'http://www.w3.org/2000/svg';
        svg = document.createElementNS(NS, 'svg');
        svg.id = 'sd-edge-svg';
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible;display:none';
        const line = document.createElementNS(NS, 'line');
        line.id = 'sd-edge-line';
        line.setAttribute('vector-effect', 'non-scaling-stroke');
        line.setAttribute('stroke-linecap', 'butt');
        svg.appendChild(line);
        document.body.appendChild(svg);
      }
      return svg;
    }

    function bspApplySdEdge(d, sdSide, sdWidthPct) {
      const existing = document.getElementById('sd-edge-svg');
      if (!sdSide || !d) {
        document.documentElement.style.removeProperty('--sd-clip');
        if (existing) existing.style.display = 'none';
        return;
      }
      const slant = Math.max(-40, Math.min(40, Number(d.sdSlant) || 0)) / 100; // signed fraction of panel width
      // Positive slant cuts the BOTTOM inner corner (top stays wider); negative cuts the top.
      const topCut = Math.max(0, -slant) * 100; // % of the panel (element) width
      const botCut = Math.max(0, slant) * 100;
      const clip = (sdSide === 'left')
        ? `polygon(0% 0%, calc(100% - ${topCut}%) 0%, calc(100% - ${botCut}%) 100%, 0% 100%)`
        : `polygon(${topCut}% 0%, 100% 0%, 100% 100%, ${botCut}% 100%)`;
      document.documentElement.style.setProperty('--sd-clip', clip);

      const strokeW = Math.max(0, Math.min(40, Number(d.sdStrokeWidth) || 0));
      const svg = bspSdEdgeSvg();
      if (strokeW <= 0) { svg.style.display = 'none'; return; }
      const W = window.innerWidth, H = window.innerHeight;
      const panelW = (Math.max(15, Math.min(90, Number(sdWidthPct) || 50)) / 100) * W;
      const off = slant * panelW; // px, signed
      let topX, botX;
      if (sdSide === 'left') {
        const rightX = panelW;        // panel left edge = 0
        topX = rightX - Math.max(0, -off);
        botX = rightX - Math.max(0, off);
      } else {
        const leftX = W - panelW;     // panel left edge for a right-side box
        topX = leftX + Math.max(0, -off);
        botX = leftX + Math.max(0, off);
      }
      const line = document.getElementById('sd-edge-line');
      line.setAttribute('x1', topX); line.setAttribute('y1', 0);
      line.setAttribute('x2', botX); line.setAttribute('y2', H);
      line.setAttribute('stroke', d.sdStrokeColor || '#FFD24AFF');
      line.setAttribute('stroke-width', strokeW);
      // Reset any leftover fade from a previous clear, or the bar would reappear invisible.
      svg.style.transition = 'none';
      svg.style.opacity = '1';
      svg.style.display = '';
    }

    // The stroke line is in screen px, so it must be recomputed when the viewport changes
    // (notably when the projection window enters/leaves fullscreen). The clip is %-based and
    // reflows on its own; this only re-lands the line.
    window.addEventListener('resize', () => {
      const m = (typeof currentState !== 'undefined' && currentState) ? currentState.mode : '';
      const side = (m === 'sd-left') ? 'left' : (m === 'sd-right') ? 'right' : '';
      if (side) bspApplySdEdge(currentState, side, Number(currentState.sdWidth) || 50);
    });

    // Scales the content down so it fits the padded box, choosing the LARGEST scale that
    // still fits — via binary search, so the result depends only on the text and the box,
    // never on the operator's base font size. (The old area/sqrt heuristic over-shrank when
    // the base font was large: a long verse would end up tiny even though a much bigger
    // scale still fit. Binary search always lands on the biggest readable size.)
    //
    // `zoom` (not font-size) is used because the reference badge carries its own inline pt
    // size — zoom scales the whole composition (reference + verse) proportionally and
    // reflows at each step, so at a smaller scale more words fit per line. Since the
    // effective font is base × zoom and the box width is fixed, two different base fonts
    // that reach the same effective size wrap identically → the fitted result is the same.
    function bspFitTextToBox(d) {
      const el = elements.txt;
      if (!el || !d) return;
      const content = el.firstElementChild;
      if (d.forceFitToBox === false) {
        el.style.zoom = '';
        if (content) content.style.zoom = '';
        return;
      }
      // Readable floor: text never shrinks below ~18% of the operator's size — smaller than
      // that is illegible on a projection. Very long content that can't fit even at the floor
      // is shown at the floor (and overflows/clips) rather than shrinking to an invisible speck.
      const READABLE_FLOOR = 0.18;
      const floor = Math.max(READABLE_FLOOR, Math.min(1, Number(d.minFitScale) || 0.20));
      el.style.zoom = '';
      if (!content) return;

      // The entrance transition (zoom/scaleIn) applies a `transform: scale()` to `content`
      // while it animates — the SAME element the fit measures. getBoundingClientRect()
      // includes that transform, so a mid-animation frame reports the wrong size and the
      // fit picks the wrong zoom. Read the live transform scale and divide it out, so the
      // fit always measures the true LAYOUT size regardless of where the animation is.
      const transformScale = () => {
        const tm = getComputedStyle(content).transform;
        if (!tm || tm === 'none') return { x: 1, y: 1 };
        const m = tm.match(/matrix\(([^)]+)\)/);
        if (!m) return { x: 1, y: 1 };
        const p = m[1].split(',').map(parseFloat);
        return { x: Math.abs(p[0]) || 1, y: Math.abs(p[3]) || 1 };
      };

      // Measures whether the content fits the padded box at a given scale. Zoom the CONTENT,
      // not the container, so availH/availW stay fixed while the block reflows.
      const fitsAt = (scale) => {
        content.style.zoom = (scale >= 1) ? '' : String(scale);
        const cs = getComputedStyle(el);
        const padT = parseFloat(cs.paddingTop) || 0, padB = parseFloat(cs.paddingBottom) || 0;
        const padL = parseFloat(cs.paddingLeft) || 0, padR = parseFloat(cs.paddingRight) || 0;
        const availH = Math.max(1, el.clientHeight - padT - padB);
        const availW = Math.max(1, el.clientWidth - padL - padR);
        const s = transformScale();
        const r = content.getBoundingClientRect();
        return ((r.height / s.y) <= availH + 1) && ((r.width / s.x) <= availW + 1);
      };

      // Fits at full size → no shrink needed (never grow past the operator's chosen size).
      if (fitsAt(1)) { content.style.zoom = ''; return; }

      // Largest scale in [floor, 1] that fits. "fits" is monotonic in scale (smaller font
      // reflows to fewer/shorter lines → smaller block), so binary search is exact.
      let lo = floor, hi = 1, best = floor;
      for (let i = 0; i < 24; i++) {
        const mid = (lo + hi) / 2;
        if (fitsAt(mid)) { best = mid; lo = mid; } else { hi = mid; }
      }
      content.style.zoom = (best >= 1) ? '' : String(best);
    }


    // ===== SD INCLINE-FOLLOWING TEXT =====
    // Makes the text's inner edge run PARALLEL to the slanted bar: each line shortens toward
    // the cut corner, keeping a constant inner margin from the diagonal — instead of a
    // rectangular block that wastes the wide end (which read as "inverted"). Implemented with
    // a shape-outside float on the inner side, sized in the fit's zoomed coordinate space so
    // its RENDERED slope matches the bar. Because adding the float changes wrapping, the
    // caller (bspFitAndIncline) alternates fit ↔ incline a couple of times to settle.
    function bspApplySdIncline(d) {
      const el = elements.txt;
      const content = el && el.firstElementChild;              // carries the fit zoom
      const body = content && content.querySelector('.jo-body');
      const isSd = d && (d.mode === 'sd-left' || d.mode === 'sd-right');
      const slantPct = Math.max(-40, Math.min(40, Number(d && d.sdSlant) || 0));
      if (!isSd || Math.abs(slantPct) < 0.5 || !body) {
        if (content) content.querySelectorAll('.sd-incline-spacer').forEach(s => s.remove());
        return;
      }
      // Measure the wrapped text block WITH the current spacer still in place — that reflects
      // the real (narrower, taller) wrapping AND its centred vertical position. Removing it
      // first would measure the wider, shorter no-float text and mis-size the new float.
      const panelRect = el.getBoundingClientRect();
      const bodyRect = body.getBoundingClientRect();
      const measuredTextH = bodyRect.height;
      // Where the (vertically centred) text block sits INSIDE the panel, in screen px from the
      // panel's top. This is the crux of the fix: the clip diagonal is defined over the FULL
      // panel height, so a text block that starts partway down already faces an edge that has
      // narrowed by (slope · yTop). Ignoring that offset — as the old triangle float did — let
      // the top lines run out to the panel's wide edge and get clipped by the diagonal.
      const yTop = bodyRect.top - panelRect.top;
      content.querySelectorAll('.sd-incline-spacer').forEach(s => s.remove());

      const panelW = panelRect.width, panelH = Math.max(1, panelRect.height);
      const zoom = parseFloat(content.style.zoom || '1') || 1;
      const off = Math.abs(slantPct) / 100 * panelW;            // diagonal's horizontal depth over the panel
      const isLeft = (d.mode === 'sd-left');
      const slantPos = slantPct > 0;                            // + cuts the bottom corner, − the top
      const clampM = (v, dflt) => Math.max(0, Math.min(40, Number(v == null ? dflt : v))) / 100;
      const innerMarginPx = (isLeft ? clampM(d.sdMarginRight != null ? d.sdMarginRight : d.sdMargin, 6)
                                    : clampM(d.sdMarginLeft  != null ? d.sdMarginLeft  : d.sdMargin, 6)) * panelW;

      // How far the inner edge is inset from the panel's WIDE side at a given screen-y — the
      // exact same line the clip-path draws (slope = off/panelH, over the full panel height).
      const insetRawAt = (yScreen) => {
        const f = slantPos ? (yScreen / panelH) : (1 - yScreen / panelH);
        return Math.max(0, Math.min(off, off * f));
      };
      // The inner margin is BAKED INTO the shape (an extra horizontal inset) rather than
      // applied via shape-margin. shape-margin rounds the offset near the trapezoid's inner
      // vertex, which let a stray line creep to within a few px of the diagonal and made the
      // margin feel like it plateaued. Adding it to the inset instead means every line stops
      // at exactly (diagonal − margin), and the offset grows linearly with the setting.
      const insetAt = (yScreen) => insetRawAt(yScreen) + innerMarginPx;

      // Float box in CONTENT (unzoomed) coords; height = text height so it never overflows
      // .jo-body (an overflowing float pins the text to the top and kills vertical centring).
      // 1.06 buffer so the diagonal always reaches past the last line despite zoom drift.
      const HfScreen = Math.max(1, measuredTextH) * 1.06;
      const insetTop = insetAt(yTop);
      const insetBot = insetAt(yTop + HfScreen);
      const WfScreen = Math.max(insetTop, insetBot, 1);
      const Hf = HfScreen / zoom;
      const Wf = WfScreen / zoom;

      // A TRAPEZOID (not a triangle): its slanted side runs parallel to the clip diagonal,
      // offset inward by the margin, across the text's actual vertical span — every line
      // stops exactly there. Percentages are ratios, so zoom-independent.
      const topPct = (WfScreen - insetTop) / WfScreen * 100;
      const botPct = (WfScreen - insetBot) / WfScreen * 100;
      const poly = isLeft
        ? `polygon(${topPct}% 0, 100% 0, 100% 100%, ${botPct}% 100%)`
        : `polygon(0 0, ${100 - topPct}% 0, ${100 - botPct}% 100%, 0 100%)`;

      const spacer = document.createElement('div');
      spacer.className = 'sd-incline-spacer';
      spacer.style.cssText =
        `float:${isLeft ? 'right' : 'left'};width:${Wf}px;height:${Hf}px;` +
        `-webkit-shape-outside:${poly};shape-outside:${poly};` +
        `shape-margin:0;pointer-events:none;`;
      body.insertBefore(spacer, body.firstChild);
      return HfScreen; // so the caller can iterate until the height stops moving
    }

    // Fit and incline alternately until the ZOOM settles, ALWAYS ending on a fit. The old
    // version ended on a trailing incline (float re-sized to the fitted text) with no fit
    // after it: re-sizing the float re-wraps the text, so the displayed zoom no longer
    // matched — leaving the text overflowing the panel bottom OR shrunk with wasted space,
    // depending on the verse. Ending on a fit guarantees the zoom is valid for the final
    // float. Converging on the zoom (not the float height) is what makes it stable in
    // narrow side-screen panels, where a small float change swings the wrapping a lot.
    function bspFitAndIncline(d) {
      const isSd = d && (d.mode === 'sd-left' || d.mode === 'sd-right') && Math.abs(Number(d.sdSlant) || 0) >= 0.5;
      bspFitTextToBox(d);
      if (!isSd) return;
      const content = elements.txt && elements.txt.firstElementChild;
      const getZoom = () => content ? (parseFloat(content.style.zoom || '1') || 1) : 1;
      let prevZoom = -1;
      for (let i = 0; i < 7; i++) {
        bspApplySdIncline(d);                    // float sized to the current text
        bspFitTextToBox(d);                      // fit within the float column (last op each pass)
        const z = getZoom();
        if (Math.abs(z - prevZoom) < 0.004) break;
        prevZoom = z;
      }
      // No trailing incline: the loop already ends on a fit, so the applied zoom fits the
      // current float and the text neither overflows nor sits needlessly small.
    }


    // ===== TRUE FULLSCREEN (projection windows) =====
    // The panel posts REQUEST_FULLSCREEN when it opens a projection window, but nothing
    // here used to listen for it — so the window stayed a normal popup with a title bar.
    // Handling it is necessary but not sufficient: requestFullscreen() called from a
    // postMessage callback has no user activation and browsers reject it. So we try
    // anyway (it succeeds when the window still holds the activation it was opened with),
    // and otherwise fall back to a one-click prompt, which supplies a real gesture.
    const BSP_IS_STANDALONE = (() => {
      try { return new URLSearchParams(location.search || '').has('standalone'); }
      catch (_) { return false; }
    })();

    function bspIsFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function bspEnterFullscreen() {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!fn) return Promise.reject(new Error('unsupported'));
      try {
        const r = fn.call(el, { navigationUI: 'hide' });
        return (r && typeof r.then === 'function') ? r : Promise.resolve();
      } catch (_) {
        try {
          const r2 = fn.call(el);
          return (r2 && typeof r2.then === 'function') ? r2 : Promise.resolve();
        } catch (err) { return Promise.reject(err); }
      }
    }

    function bspShowFullscreenPrompt(show) {
      let el = document.getElementById('bsp-fs-prompt');
      if (!el) {
        if (!show) return;
        el = document.createElement('div');
        el.id = 'bsp-fs-prompt';

    // Try fullscreen; if we're still not fullscreen a moment later, ask for one click.

    function computeLtHeight(d) {
      let ltHeight = Number(d.ltBgHeightPct || 20);

        const extraPerLine = d.isBible ? 4 : 2.5;
        ltHeight = ltHeight + Math.max(0, (lineCount - 2) * extraPerLine);
      }
      return clamp(ltHeight, d.isBible ? 12 : 10, d.isBible ? 50 : 40);
    }

    function getLtAnchorMode(d) {
      return (d && d.ltAnchorMode === 'top') ? 'top' : 'bottom';
    }

    function getLtOffsetY(d) {
      return Math.max(-1200, Math.min(1200, Number(d && d.ltOffsetY) || 0));
    }

    function getLtOffsetX(d) {
      return Math.max(-1200, Math.min(1200, Number(d && d.ltOffsetX) || 0));
    }

    function getFullOffsetX(d) {

    function getLtWrapTransform(d) {
      const rawOffsetX = getLtOffsetX(d);
      const rawOffset = getLtOffsetY(d);
      const isTop = getLtAnchorMode(d) === 'top';
      const translateY = isTop ? rawOffset : -rawOffset;
      const scale = getLtScaleFactor(d);
      return `translate(calc(-50% + ${rawOffsetX}px), ${translateY}px) scale(${scale})`;
    }

    function getLtTextTransform(d) {
      const rawOffsetX = getLtOffsetX(d);
      const rawOffset = getLtOffsetY(d);
      const isTop = getLtAnchorMode(d) === 'top';
      const translateY = isTop ? rawOffset : -rawOffset;
      const scale = getLtScaleFactor(d);
      return `translate(${rawOffsetX}px, ${translateY}px) scale(${scale})`;

    function applySongLtVerticalLayout(d, ltHeight, sidePad, vAlignLT, anchorMode) {

      const edgePadPx = Math.max(14, Math.round(0.016 * window.innerHeight));
      const fittedHeightPx = Math.max(txtHeight + (edgePadPx * 2), 64);
      const actualHeightPx = d.autoAdjustLtHeight ? Math.min(requestedHeightPx, fittedHeightPx) : requestedHeightPx;
      const actualHeightVh = (actualHeightPx / window.innerHeight) * 100;

        const available = Math.max(0, actualHeightPx - (edgePadPx * 2));
        if (txtHeight <= available) {

    function buildTypedLine(htmlLine) {
      const temp = document.createElement('div');
      temp.innerHTML = htmlLine || '';
      const lineEl = document.createElement('div');
      lineEl.className = 'type-line';
      
      const processNode = (node, parent) => {
        if (node.nodeType === Node.TEXT_NODE) {
          const parts = node.textContent.split(/(\s+)/);
          parts.forEach(part => {
            if (!part) return;
            if (/^\s+$/.test(part)) {
              parent.appendChild(document.createTextNode(part));
            } else {
              const w = document.createElement('span');
              w.className = 'type-word hidden-word';
              w.textContent = part;
              parent.appendChild(w);
            }
          });
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          const clone = node.cloneNode(false);
          parent.appendChild(clone);
          node.childNodes.forEach(child => processNode(child, clone));
        }
      };
      
      temp.childNodes.forEach(child => processNode(child, lineEl));
      return lineEl;
    }

    // Recompute normalized layout and reapply preserved LT layout on window resize
    function handleLtLayoutResize() {

      window._joResizeRaf = requestAnimationFrame(() => {

        if (lastSongLtLayout.heightVh != null) {
          const ltHeightPx = (lastSongLtLayout.heightVh / 100) * window.innerHeight;
          if (lastSongLtLayout.padTopNorm != null) {
            lastSongLtLayout.padTopPx = Math.round(lastSongLtLayout.padTopNorm * ltHeightPx);
          } else if (lastSongLtLayout.padTopPx != null && ltHeightPx > 0) {
            lastSongLtLayout.padTopNorm = lastSongLtLayout.padTopPx / ltHeightPx;
            lastSongLtLayout.padTopPx = Math.round(lastSongLtLayout.padTopNorm * ltHeightPx);
          }
          if (lastSongLtLayout.padBottomNorm != null) {
            lastSongLtLayout.padBottomPx = Math.round(lastSongLtLayout.padBottomNorm * ltHeightPx);
          } else if (lastSongLtLayout.padBottomPx != null && ltHeightPx > 0) {
            lastSongLtLayout.padBottomNorm = lastSongLtLayout.padBottomPx / ltHeightPx;
            lastSongLtLayout.padBottomPx = Math.round(lastSongLtLayout.padBottomNorm * ltHeightPx);
          }
        } else {
          // If no stored LT vh, attempt to infer from current LT wrap height
          const inferredRect = elements.ltWrap ? elements.ltWrap.getBoundingClientRect() : null;
          const inferredLtHeightPx = inferredRect ? inferredRect.height : 0;
          if (inferredLtHeightPx > 0) {
            if (lastSongLtLayout.padTopPx != null) lastSongLtLayout.padTopNorm = lastSongLtLayout.padTopPx / inferredLtHeightPx;
            if (lastSongLtLayout.padBottomPx != null) lastSongLtLayout.padBottomNorm = lastSongLtLayout.padBottomPx / inferredLtHeightPx;
          }
        }

        if (lastSongLtLayout.visualBottomNorm != null) {

        if (d.bgEnabled) {
          elements.bg.style.filter = `blur(${blurPx}px)`;
          syncVideoState(elements.bgVideo, bgVideoSrc, (d.bgType === 'video' && !!bgVideoSrc), { ...videoSettings, fadeOut: (lastBgType === 'video' && d.bgType !== 'video'), revealOpacity: bgOpacity });
          syncYoutubeState(elements.bgYoutube, elements.bgYoutubeFrame, bgYoutubeSrc, (d.bgType === 'video' && !!bgYoutubeSrc));

          const applyFullBackground = () => {
            if (bgVideoSrc) {
              elements.bg.style.backgroundImage = 'none';
              elements.bg.style.backgroundColor = 'transparent';
            } else if (bgGifSrc) {
              elements.bg.style.backgroundImage = `url(${bgGifSrc})`;
              elements.bg.style.backgroundColor = 'transparent';
            } else if (bgYoutubeSrc) {
              elements.bg.style.backgroundImage = 'none';
              elements.bg.style.backgroundColor = 'transparent';
            } else if (d.bgType === 'image' && d.bgImage) {
              elements.bg.style.backgroundImage = `url(${d.bgImage})`;
              elements.bg.style.backgroundColor = 'transparent';
            } else {
              const gradStart = d.bgGradientShadow || d.bgColor || 'black';
              const gradEnd = d.bgGradientHighlight || d.bgColor || 'black';
              if (d.bgMode === 'gradient') {
                const angle = typeof d.bgGradientAngle !== 'undefined' ? d.bgGradientAngle : 90;
                elements.bg.style.backgroundImage = `linear-gradient(${angle}deg, ${gradStart} 0%, ${gradEnd} 100%)`;
                elements.bg.style.backgroundColor = gradStart;
              } else {
                elements.bg.style.backgroundImage = 'none';
                elements.bg.style.backgroundColor = d.bgColor || 'black';
              }
            }
          };

          const shouldFade = (bgModeChanged || bgTypeChanged) && bgCurrentlyActive && prevBgState.full && !bgVideoSrc && !bgGifSrc && !bgYoutubeSrc;
          const shouldFadeIn = bgCurrentlyActive && !prevBgState.full && !bgVideoSrc && !bgYoutubeSrc;
          const shouldFadeFromVideo = bgTypeChanged && bgCurrentlyActive && prevBgState.full && !bgVideoSrc && !bgGifSrc && !bgYoutubeSrc && lastBgType === 'video';
          const shouldFadeToVideo = bgTypeChanged && bgCurrentlyActive && prevBgState.full && (!!bgVideoSrc || !!bgGifSrc) && lastBgType !== 'video';
          if (shouldFadeFromVideo) {
            // Video fades out via syncVideoState fadeOut option — just apply new bg underneath
            applyFullBackground();
            elements.bg.style.opacity = `${bgOpacity}`;
          } else if (shouldFadeIn) {
            const cf = elements.bgCrossfade;
            cf.style.transition = 'none';
            applyFullBackground();
            const nextBgImage = elements.bg.style.backgroundImage;
            const nextBgColor = elements.bg.style.backgroundColor;
            elements.bg.style.opacity = '0';
            cf.style.backgroundImage = nextBgImage;
            cf.style.backgroundColor = nextBgColor;
            cf.style.filter = elements.bg.style.filter || '';
            cf.style.opacity = '0';
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                cf.style.transition = 'opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                cf.style.opacity = `${bgOpacity}`;
                setTimeout(() => {
                  elements.bg.style.opacity = `${bgOpacity}`;
                  cf.style.transition = 'none';
                  cf.style.opacity = '0';
                }, 520);
              });
            });
          } else if (shouldFade) {
            // Crossfade dissolve: show old bg on overlay, apply new bg underneath, fade overlay out
            const cf = elements.bgCrossfade;
            cf.style.transition = 'none';
            cf.style.backgroundImage = lastFullBgStyle.backgroundImage;
            cf.style.backgroundColor = lastFullBgStyle.backgroundColor;
            cf.style.filter = elements.bg.style.filter || '';
            cf.style.opacity = `${bgOpacity}`;
            // Apply new background to main layer immediately (hidden behind overlay)
            applyFullBackground();
            elements.bg.style.opacity = `${bgOpacity}`;
            // Force paint of overlay with old bg, then fade it out
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                cf.style.transition = 'opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                cf.style.opacity = '0';
              });
            });
          } else if (shouldFadeToVideo) {
            // Hold old background on crossfade overlay until video is ready
            const cf = elements.bgCrossfade;
            cf.style.transition = 'none';
            cf.style.backgroundImage = lastFullBgStyle.backgroundImage;
            cf.style.backgroundColor = lastFullBgStyle.backgroundColor;
            cf.style.filter = elements.bg.style.filter || '';
            cf.style.opacity = `${bgOpacity}`;
            applyFullBackground();
            elements.bg.style.opacity = `${bgOpacity}`;
            // Fade out overlay once video element is visible (canplay fired)
            const targetVideo = bgVideoSrc ? elements.bgVideo : null;
            const fadeOutOverlay = () => {
              requestAnimationFrame(() => {
                cf.style.transition = 'opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                cf.style.opacity = '0';
              });
            };
            if (targetVideo && targetVideo.readyState < 2) {
              targetVideo.addEventListener('canplay', function onReady() {
                targetVideo.removeEventListener('canplay', onReady);
                fadeOutOverlay();
              });
              // Safety timeout — don't hold overlay forever
              setTimeout(fadeOutOverlay, 3000);
            } else {
              // Already ready or gif — just dissolve
              requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                  cf.style.transition = 'opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                  cf.style.opacity = '0';
                });
              });
            }
          } else {
            applyFullBackground();
            elements.bg.style.opacity = `${bgOpacity}`;
          }
          // Store current bg style for next crossfade
          lastFullBgStyle = {
            backgroundImage: elements.bg.style.backgroundImage,
            backgroundColor: elements.bg.style.backgroundColor
          };
        } else {
          elements.bg.style.opacity = '0';
          syncVideoState(elements.bgVideo, bgVideoSrc, false, videoSettings);
          syncYoutubeState(elements.bgYoutube, elements.bgYoutubeFrame, bgYoutubeSrc, false);
        }
      }
      
      // Force reflow to ensure proper rendering
      lastBGMode = requestedBgMode;
      lastBgType = requestedBgType;
      requestAnimationFrame(() => {
        if (suppressBgTransition) elements.bg.style.transition = '';
        if (suppressLtTransition) elements.ltWrap.style.transition = '';
        if (suppressCustomBgTransition) elements.ltWrap.style.transition = '';
        if (mode === 'lt' && d.bgEnabled) {
          const ltAnchorMode = getLtAnchorMode(d);
          const isTopAnchor = ltAnchorMode === 'top';
          const ltOffsetY = getLtOffsetY(d);
          elements.ltWrap.style.opacity = bgOpacity;

          // Recompute LT height (auto-resize by line count) and centering after layout so measurements are accurate
          applyLtBandOffset(d);
          applyLtBorderRadius(d);
          const ltHeight = computeLtHeight(d);
          elements.ltWrap.style.height = `${ltHeight}vh`;
          applyLtAnchorMode(ltAnchorMode);

          if (!isBible) {
            applyLtTextOffset(d);
            const sidePad = `${d.padLRLT || d.padLR || 5}%`;
            const vAlignLT = d.vAlignLT || 'middle';
            applySongLtVerticalLayout(d, ltHeight, sidePad, vAlignLT, ltAnchorMode);
          } else {
            applyBibleLtLayout(d, ltHeight, ltAnchorMode);
          }
        } else if (mode === 'lt' && !d.bgEnabled && isBible) {
          const ltAnchorMode = getLtAnchorMode(d);
          const ltHeight = computeLtHeight(d);
          applyLtAnchorMode(ltAnchorMode);
          applyBibleLtLayout(d, ltHeight, ltAnchorMode);
        } else if (mode === 'lt' && !d.bgEnabled && !isBible) {
          const ltAnchorMode = getLtAnchorMode(d);
          const ltHeight = computeLtHeight(d);
          const sidePad = `${d.padLRLT || d.padLR || 5}%`;
          const vAlignLT = d.vAlignLT || 'middle';
          applySongLtVerticalLayout(d, ltHeight, sidePad, vAlignLT, ltAnchorMode);
        }
        if (mode === 'full' && d.bgEnabled) {
          elements.bg.style.opacity = bgOpacity;
        }
      });
      
      bgActivePrev = bgCurrentlyActive;
      ltBgActivePrev = ltCurrentlyActive;
      customBgActivePrev = (mode === 'custom' && d.bgEnabled);
    }
    
    // Clear display
    function finalizeClear() {
      if (clearTimer) {
        clearTimeout(clearTimer);
        clearTimer = null;
      }
      elements.txt.style.opacity = '0';
      elements.bg.style.opacity = '0';
      elements.ltWrap.style.opacity = '0';
      syncVideoState(elements.bgVideo, null, false, { loop: true, playbackRate: 1 });
      syncVideoState(elements.ltVideo, null, false, { loop: true, playbackRate: 1 });
      syncYoutubeState(elements.bgYoutube, elements.bgYoutubeFrame, null, false);
      syncYoutubeState(elements.ltYoutube, elements.ltYoutubeFrame, null, false);
      elements.customRefBox.style.display = 'none';
      if (elements.customVersionBar) elements.customVersionBar.style.display = 'none';
      elements.customMainBar.style.display = 'none';
      elements.txt.innerHTML = '';
      elements.txt.classList.remove('transition-anim', 'anim-fade', 'anim-zoom', 'anim-write', 'slide-up', 'scale-in');
      elements.customMainBar.classList.remove('transition-anim', 'anim-fade', 'anim-zoom', 'anim-write');
      elements.customRefBox.classList.remove('transition-anim', 'anim-fade', 'anim-zoom', 'anim-write');
      if (elements.customVersionBar) {
        elements.customVersionBar.classList.remove('transition-anim', 'anim-fade', 'anim-zoom', 'anim-write');
      }
      clearTypeTimers();
      // The SD stroke bar / diagonal clip live on a standalone SVG overlay + a CSS variable,
      // outside the text/bg/lt layers above — so clearing those left the coloured bar hanging
      // on screen. Retire it (and drop --sd-clip) here.
      if (typeof bspApplySdEdge === 'function') bspApplySdEdge(null, '', 0);
      transitionState.textKey = null;
      transitionState.type = null;
      transitionState.startTime = 0;
      transitionState.duration = 0;
      
      currentState = {
        mode: 'full',
        isBible: false,
        text: '',
        styleData: null,
        isLive: false
      };
    }

    function clearDisplay(opts = {}) {
      const fade = opts.fade !== false;
      const durationSec = clamp(Number(opts.duration ?? currentState.transitionDuration ?? 0.3), 0, 10);
      bspLastAppliedSig = null; // après un effacement, ré-afficher le même contenu doit redessiner
      cancelPendingClear();
      const animTargets = [elements.txt, elements.customMainBar, elements.customRefBox, elements.customVersionBar];
      animTargets.forEach((el) => {
        if (!el) return;
        el.classList.remove('transition-anim', 'anim-fade', 'anim-zoom', 'anim-write');
        el.style.animation = 'none';
        void el.offsetWidth; // ensure animation reset applies immediately
        el.style.animation = '';
      });
      clearTypeTimers();
      if (!fade || durationSec <= 0) {
        finalizeClear();
        return;
      }
      const token = clearToken;
      elements.txt.style.opacity = '0';
      elements.bg.style.opacity = '0';
      elements.ltWrap.style.opacity = '0';
      // Fade the SD stroke bar out WITH the text, so it doesn't linger a beat then vanish.
      const sdSvg = document.getElementById('sd-edge-svg');
      if (sdSvg) { sdSvg.style.transition = `opacity ${durationSec}s ease`; sdSvg.style.opacity = '0'; }
      elements.customRefBox.style.opacity = '0';
      elements.customMainBar.style.opacity = '0';
      if (elements.customVersionBar) elements.customVersionBar.style.opacity = '0';
      clearTimer = setTimeout(() => {
        if (token !== clearToken) return;
        finalizeClear();
      }, Math.round(durationSec * 1000));
    }
    
    // Calculate optimal font size for Bible LT mode
    function calculateBibleFontSize(lineCount, baseSize) {
      if (lineCount <= 2) return baseSize;
      if (lineCount === 3) return Math.max(baseSize * 0.85, 24);
      if (lineCount === 4) return Math.max(baseSize * 0.75, 20);
      return Math.max(baseSize * 0.65, 18);
    }
    
    // Handle window resize
    function handleResize() {
      resizeYoutubeFrames();
      if (currentState.mode === 'lt' && currentState.isBible) {
        // Recalculate positioning for Bible LT mode
        const textX = Number(currentState.textX || 0);
        const textY = Number(currentState.textY || 860);
        const padLR = Math.max(0, Math.min(20, Number(currentState.padLR ?? 0)));
        
        elements.txt.style.left = (textX + (padLR * 0.01 * window.innerWidth / 100)) + 'px';
        elements.txt.style.right = (padLR * 0.01 * window.innerWidth / 100) + 'px';
      }
    }
    
    // ===== INIT =====
    function bindDisplayEventsOnce() {
      if (window.__bspDisplayEventsBound) return;
      window.__bspDisplayEventsBound = true;
      window.addEventListener('resize', handleLtLayoutResize);
      window.addEventListener('resize', handleResize);
      window.addEventListener('beforeunload', () => {
        if (rafId) cancelAnimationFrame(rafId);
        if (helloTimer) {
          clearInterval(helloTimer);
          helloTimer = null;
        }
        channel.close();
        disconnectRelay();
      });
      window.addEventListener('error', (ev) => {
        const m = (ev && ev.message) ? ev.message : (ev && ev.error ? String(ev.error) : 'Unknown error');
        debug('Window error: ' + m + ' at ' + (ev.filename || '') + ':' + (ev.lineno||'') + ':' + (ev.colno||''), true);
      });
      window.addEventListener('unhandledrejection', (ev) => {
        debug('Unhandled rejection: ' + (ev && ev.reason && (ev.reason.message || String(ev.reason)) || String(ev.reason)), true);
      });
    }

    function initDisplay() {
      bindDisplayEventsOnce();
      init();
    }

    window.addEventListener('load', initDisplay);
    
    // Export for debugging
    window.displayDebug = {
      currentState,
      elements,
      clearDisplay,
      updateSettings: handleUpdate
    };
    
    console.log('Bible Song Pro Display loaded successfully');

  </script>
